<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stok Barang | CV. Satu Atap Karya</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #F3F5F9; --sf: #fff; --ink: #0B1F3F; --mu: #5B6B85; --ln: #D8DFEA; --ac: #1F4E9C;
      --acs: #E4ECF8; --ok: #1E7B4B; --wa: #9A6700; --bd: #C0392B; --hd: #0B1F3F; color-scheme: light;
      box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #08142B; --sf: #0F2142; --ink: #E8EEF8; --mu: #9AA9C4; --ln: #1E345E; --ac: #6B9AE8; --acs: #16305C; --ok: #5FC48D; --wa: #E8B550; --bd: #F07A6B; --hd: #0F2142; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] { --bg: #08142B; --sf: #0F2142; --ink: #E8EEF8; --mu: #9AA9C4; --ln: #1E345E; --ac: #6B9AE8; --acs: #16305C; --ok: #5FC48D; --wa: #E8B550; --bd: #F07A6B; --hd: #0F2142; color-scheme: dark; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 Barlow, system-ui, sans-serif; padding-bottom: 150px; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--hd); z-index: 10; }
    header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--hd); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
    header .lg { background: #fff; border-radius: 10px; padding: 5px 7px; display: flex; }
    header img { height: 34px; display: block; }
    header b { font-size: 19px; font-weight: 700; letter-spacing: .2px; display: block; line-height: 1.1; }
    header small { opacity: .75; font-size: 13px; }
    main { max-width: 640px; margin: 0 auto; padding: 14px 14px 0; }
    h3 { font-size: 15px; margin: 18px 2px 8px; color: var(--mu); font-weight: 600; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip { flex: none; border: 1px solid var(--ln); background: var(--sf); color: var(--ink); border-radius: 20px; padding: 7px 14px; font: inherit; font-size: 14px; }
    .chip.on { background: var(--ac); border-color: var(--ac); color: #fff; font-weight: 600; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--sf); border: 1px solid var(--ln); border-radius: 10px; padding: 11px 13px; margin-bottom: 7px; }
    .row .n { font-weight: 600; }
    .row .s { font-size: 13px; color: var(--mu); }
    .row .r { text-align: right; white-space: nowrap; }
    .row .q { font-size: 20px; font-weight: 700; }
    .bg { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; display: inline-block; }
    .Aman { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
    .Menipis { color: var(--wa); background: color-mix(in srgb, var(--wa) 16%, transparent); }
    .Habis, .Minus { color: var(--bd); background: color-mix(in srgb, var(--bd) 14%, transparent); }
    .in { color: var(--ok); }
    .out { color: var(--bd); }
    .alert { background: color-mix(in srgb, var(--wa) 14%, transparent); border-radius: 10px; padding: 10px 13px; margin: 10px 0 4px; font-size: 14px; }
    .empty { text-align: center; color: var(--mu); padding: 40px 10px; }
    .empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }
    .card { background: var(--sf); border: 1px solid var(--ln); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card h2 { font-size: 17px; margin: 0 0 6px; }
    .card p { margin: 0 0 10px; color: var(--mu); font-size: 14px; }
    .b { font: inherit; font-weight: 600; border: 1px solid var(--ln); background: var(--sf); color: var(--ink); border-radius: 10px; padding: 10px 16px; cursor: pointer; }
    .b.pri { background: var(--ac); border-color: var(--ac); color: #fff; }
    .b.dang { color: var(--bd); border-color: var(--bd); }
    .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
    label { display: block; font-size: 14px; font-weight: 500; color: var(--mu); margin-top: 10px; }
    input, select { display: block; width: 100%; margin-top: 4px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--ln); border-radius: 9px; padding: 10px 11px; }
    input:focus-visible, select:focus-visible, .b:focus-visible, .chip:focus-visible, nav button:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fab { position: fixed; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 8; border: 0; background: var(--ac); color: #fff; font: inherit; font-weight: 700; border-radius: 28px; padding: 14px 20px; box-shadow: 0 10px 20px rgba(31, 78, 156, .26); }
    nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--sf); border-top: 1px solid var(--ln); display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); }
    nav button { flex: 1; border: 0; background: none; color: var(--mu); font: inherit; font-size: 13px; padding: 14px 2px; }
    nav button.on { color: var(--ac); font-weight: 700; box-shadow: inset 0 3px 0 var(--ac); }
    .ov { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: var(--sf); width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
    .sheet h2 { margin: 0 0 2px; font-size: 19px; }
    .err { color: var(--bd); font-size: 14px; margin: 8px 0 0; min-height: 1px; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 25; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { background: var(--bg); border: 1px solid var(--ln); border-radius: 12px; padding: 12px; }
    .metric .label { display: block; font-size: 12px; color: var(--mu); margin: 0 0 8px; }
    .metric .value { display: block; font-size: 28px; font-weight: 700; line-height: 1.1; }
    .metric .sub { display: block; font-size: 12px; color: var(--mu); margin-top: 6px; }
    .search-box { margin: 0 0 10px; }
    .search-box input { margin-top: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .sheet { animation: up .18s ease-out; }
      @keyframes up { from { transform: translateY(24px); opacity: .6; } }
    }
  </style>
</head>
<body>
  <header>
    <span class="lg"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaQAAAENCAYAAABAXxETAAEAAElEQVR42uxdd3wc1dU9972ZXTX3bmoaEJKQENMCAdF7CyABCS0QDKGEEEpoZi0bm94CKRBSIQUJCF+oIRAQECAEU42xwca4ylVW392Zefd+f7yZbdpVMdR0xE9Wt8FCl0d7mKxR+WKTg13nqQtf9+sjkY2vVT7nAw40RNgm0fPjKz+9i8v0LXNGQZq4NGqL0eunwtd+v1Q3V1rYIramPER9Aq4yH4hw1vZ7eN9Qz27pvTSEd0ejm0z6f0UQn3nW0Sxxb5VdFQwJvAoLReanFoWjg1K2p+uLCldwBkrm26x6h2b4aQ0vm0gV9h3j0e0M7xI6x0Wg+O3hQLdaA2P4Lw4on2cTlh2Zj3i0woNGYpZEr2S2n2dJZi2mCfB6wXWJQ5x3Wg8Q8RUS1Y5wN6l5fJjJ+S0m8j1FQjJ09U/QAAABJRU5ErkJggg==" alt="logo"></span>
    <div>
      <b>Stok Barang</b>
      <small>CV. Satu Atap Karya</small>
    </div>
  </header>
  <main id="v"></main>
  <button class="fab" id="fab"></button>
  <nav id="nav"></nav>
  <div id="m"></div>
  <div id="t" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script>
    const K = 'sab_v1';
    const KATS = ['Barang Habis Pakai', 'Inventaris Alat', 'Material Bangunan'];
    const SH = ['Semua', 'Habis Pakai', 'Inventaris Alat', 'Material Bangunan'];
    const LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaQAAAENCAYAAABAXxETAAEAAElEQVR42uxdd3wc1dU9972ZXTX3bmoaEJKQENMCAdF7CyABCS0QDKGEEEpoZi0bm94CKRBSIQUJCF+oIRAQECAEU42xwca4ylVW392Zefd+f7yZbdpVMd5bNcxhn2f9SaC5YOz9v1ewk4Y7UlbBOhZpS+jessJHjQVlyK9o3I+L7s2ZD9b2Hzjqqn1NMXd9Q3Q1vnsrO8O6qO1Eav0I0XIQdB5Fn3O7o5n4nrBnqWcB5xnNQ5Y1S51gQw7mXx2sXlW9kwd28kGK9g0XlB4PZQ0Fll10k1aT5t2fJ9gP4fD0P98IjRLf+cbFZGTJmsiR0f0EFw9l5nS2wvh8gVgC/vY8jN6yKKh4EyEgbRrnHc1Y0tSboPO4wdvW+o5q0JcDmvV7dM6KpJidA8u2Ctcv4e9D0r0oHVwGrY2sX7x1wdyuJ14E2yqD4b5KkB3R6Df4w0XGP8IkzQ5lK7Hk790rj/J0f10I5z1wB0kL3z14gL2GvAXNACvA5YF9CpPhAItRBGgQ8R3S0VyZZbOeqvP7dGLgK8nQ4Hk3wQy6D2SpP4tR/1gLfJ/Z7M9SDVHh+2YhC5tPK+tYxxXKNt8Q7V2FAkAZp8RkT9w4mTVcQv8MUv0yqf7rTq5pJcA3UN4mR0YEF1i9e9lM1pgL0Q==';
    const TABS = [['stok', 'Stok'], ['masuk', 'Masuk'], ['keluar', 'Keluar'], ['barang', 'Barang'], ['lain', 'Lainnya']];
    const FAB = { stok: '+ Barang', masuk: '+ Barang masuk', keluar: '+ Barang keluar', barang: '+ Barang' };

    let S = loadState();
    let tab = 'stok';
    let cat = 0;
    let pend = null;
    let rep = { t: 'stok', c: 0, f: '', to: '' };
    let search = '';

    const $ = (selector) => document.querySelector(selector);
    const esc = (value) => String(value == null ? '' : value).replace(/[&<>\"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char] || char));
    const num = (value) => (Number(value) || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
    const rp = (value) => 'Rp ' + num(value);
    const today = () => {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    };
    const dm = (value) => (value ? value.split('-').reverse().join('/') : '');
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const normalizeText = (value) => String(value ?? '').trim().toLowerCase();

    function loadState() {
      try {
        const raw = localStorage.getItem(K);
        if (!raw) return { items: [], masuk: [], keluar: [] };
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.items) || !Array.isArray(parsed.masuk) || !Array.isArray(parsed.keluar)) {
          return { items: [], masuk: [], keluar: [] };
        }
        return { items: parsed.items, masuk: parsed.masuk, keluar: parsed.keluar };
      } catch (error) {
        return { items: [], masuk: [], keluar: [] };
      }
    }

    function persist() {
      try {
        localStorage.setItem(K, JSON.stringify(S));
      } catch (error) {
        toast('Data tidak bisa disimpan di perangkat. Segera buat backup.');
      }
    }

    function lsGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    function toast(message) {
      const toastElement = $('#t');
      if (!toastElement) return;
      toastElement.textContent = message;
      toastElement.style.display = 'block';
      clearTimeout(toast.h);
      toast.h = setTimeout(() => {
        toastElement.style.display = 'none';
      }, 3200);
    }

    function calc() {
      const map = {};
      S.items.forEach((item) => {
        map[item.id] = { i: item, in: 0, out: 0 };
      });
      S.masuk.forEach((entry) => {
        if (map[entry.bid]) {
          map[entry.bid].in += Number(entry.qty) || 0;
        }
      });
      S.keluar.forEach((entry) => {
        if (map[entry.bid]) {
          map[entry.bid].out += Number(entry.qty) || 0;
        }
      });
      Object.values(map).forEach((row) => {
        row.s = (Number(row.i.awal) || 0) + row.in - row.out;
        row.st = row.s < 0 ? 'Minus' : row.s === 0 ? 'Habis' : row.s <= (Number(row.i.min) || 0) ? 'Menipis' : 'Aman';
      });
      return map;
    }

    function getVisibleItems() {
      const needle = normalizeText(search);
      if (!needle) return S.items.slice();
      return S.items.filter((item) => {
        const haystack = [item.kode, item.nama, item.kat, item.satuan, item.id].join(' ');
        return normalizeText(haystack).includes(needle);
      });
    }

    const inCat = (item) => !cat || (item && item.kat === KATS[cat - 1]);

    function searchBar() {
      return `
        <div class="card search-box">
          <label style="margin:0 0 6px; display:block;">Pencarian cepat</label>
          <input type="search" value="${esc(search)}" placeholder="Cari kode, nama, kategori, satuan..." oninput="search=this.value;render()">
        </div>
      `;
    }

    function chips() {
      return `<div class="chips">${SH.map((label, index) => `<button class="chip${index === cat ? ' on' : ''}" onclick="cat=${index};render()">${label}</button>`).join('')}</div>`;
    }

    function empty(title, subtitle) {
      return `<div class="empty"><b>${title}</b>${subtitle}</div>`;
    }

    function groups(rows, formatter) {
      let html = '';
      KATS.forEach((category, index) => {
        if (cat && cat !== index + 1) return;
        const filtered = rows.filter((row) => row.i && row.i.kat === category);
        if (filtered.length) {
          html += `<h3>${category}</h3>${filtered.map((row) => formatter(row)).join('')}`;
        }
      });
      return html;
    }

    function dashboard() {
      const C = calc();
      const items = S.items.map((item) => C[item.id] || { i: item, in: 0, out: 0 });
      const totalBarang = items.length;
      const aman = items.filter((row) => row.st === 'Aman').length;
      const alerting = items.filter((row) => row.st !== 'Aman').length;
      const habis = items.filter((row) => row.st === 'Habis' || row.st === 'Minus').length;
      const pembelian = S.masuk.reduce((sum, entry) => sum + ((Number(entry.qty) || 0) * (Number(entry.harga) || 0)), 0);
      const totalKeluar = S.keluar.reduce((sum, entry) => sum + (Number(entry.qty) || 0), 0);

      return `
        <div class="card">
          <h2>Dashboard</h2>
          <div class="search-box">
            <input type="search" value="${esc(search)}" placeholder="Cari kode / nama / kategori..." oninput="search=this.value;render()">
          </div>
          <div class="dashboard-grid">
            <div class="metric"><span class="label">Total barang</span><span class="value">${num(totalBarang)}</span><span class="sub">Seluruh item aktif</span></div>
            <div class="metric"><span class="label">Stok aman</span><span class="value">${num(aman)}</span><span class="sub">Belum perlu perhatian</span></div>
            <div class="metric"><span class="label">Perlu dicek</span><span class="value">${num(alerting)}</span><span class="sub">Menipis / habis / minus</span></div>
            <div class="metric"><span class="label">Habis / minus</span><span class="value">${num(habis)}</span><span class="sub">Butuh tindakan cepat</span></div>
            <div class="metric" style="grid-column:1 / -1;"><span class="label">Pembelian total</span><span class="value">${rp(pembelian)}</span><span class="sub">${num(S.masuk.length)} transaksi masuk</span></div>
            <div class="metric" style="grid-column:1 / -1;"><span class="label">Barang keluar</span><span class="value">${num(totalKeluar)}</span><span class="sub">${num(S.keluar.length)} transaksi keluar</span></div>
          </div>
        </div>
      `;
    }

    function render() {
      const C = calc();
      let html = '';

      if (tab === 'stok' || tab === 'barang') {
        const visibleItems = getVisibleItems();
        const rows = visibleItems.map((item) => C[item.id] || { i: item, in: 0, out: 0 });
        const low = rows.filter((row) => inCat(row.i) && row.st !== 'Aman').length;

        html = searchBar() + chips() + (tab === 'stok' && low ? `<p class="alert">${low} barang perlu dicek: stok menipis, habis, atau minus.</p>` : '') +
          (visibleItems.length ? groups(rows, (row) => tab === 'stok' ?
            `<div class="row" onclick="itemForm('${row.i.id}')"><div><div class="n">${esc(row.i.nama)}</div><div class="s">${esc(row.i.kode)} | masuk ${num(row.in)} | keluar ${num(row.out)}</div></div><div class="r"><div class="q ${row.st}">${num(row.s)}</div><span class="bg ${row.st}">${row.st}</span></div></div>` :
            `<div class="row" onclick="itemForm('${row.i.id}')"><div><div class="n">${esc(row.i.nama)}</div><div class="s">${esc(row.i.kode)} | ${esc(row.i.satuan)} | stok awal ${num(row.i.awal)} | minimum ${num(row.i.min)}</div></div><div class="r"><div class="q">${num(row.s)}</div><span class="bg ${row.st}">${row.st}</span></div></div>`) :
            empty(search ? 'Tidak ada barang cocok pencarian' : 'Tidak ada barang di kategori ini', search ? 'Coba kata kunci lain atau ubah filter kategori.' : 'Pilih kategori lain atau tambah barang.'));

        if (!S.items.length) {
          html = searchBar() + chips() + empty('Belum ada barang', 'Mulai dengan tombol “+ Barang”, lalu catat barang masuk dan keluar.');
        }
      } else if (tab === 'masuk' || tab === 'keluar') {
        const list = S[tab].filter((entry) => C[entry.bid] && inCat(C[entry.bid].i)).sort((a, b) => `${b.tgl}${b.id}`.localeCompare(`${a.tgl}${a.id}`));
        html = searchBar() + chips() + (list.length ? list.map((entry) => {
          const row = C[entry.bid];
          const meta = `${dm(entry.tgl)}${entry.no ? ' | ' + esc(entry.no) : ''}${entry.sup ? ' | ' + esc(entry.sup) : ''}${entry.tujuan ? ' | ' + esc(entry.tujuan) : ''}`;
          return `<div class="row" onclick="txForm('${tab}','${entry.id}')"><div><div class="n">${esc(row.i.nama)}</div><div class="s">${meta}</div></div><div class="r"><div class="q ${tab === 'masuk' ? 'in' : 'out'}">${tab === 'masuk' ? '+' : '-'}${num(entry.qty)}</div><span class="bg ${tab === 'masuk' ? 'in' : 'out'}">${tab === 'masuk' ? 'Masuk' : 'Keluar'}</span></div></div>`;
        }).join('') : empty('Belum ada transaksi', 'Catat barang masuk atau keluar untuk mulai.'));
      } else {
        html = dashboard() + lain();
      }

      $('#v').innerHTML = html;
      $('#nav').innerHTML = TABS.map(([key, label]) => `<button class="${key === tab ? 'on' : ''}" onclick="tab='${key}';render();scrollTo(0,0)">${label}</button>`).join('');

      const fab = $('#fab');
      if (fab) {
        fab.style.display = FAB[tab] ? 'block' : 'none';
        fab.textContent = FAB[tab] || '';
        fab.onclick = () => (tab === 'masuk' || tab === 'keluar' ? txForm(tab) : itemForm());
      }
    }

    function lain() {
      const last = lsGet('sab_last');
      let html = `<div class="card"><h2>Data & backup</h2><p>Data tersimpan di perangkat ini (${S.items.length} barang, ${S.masuk.length} masuk, ${S.keluar.length} keluar). ${last ? 'Backup terakhir: ' + dm(last) : 'Belum ada backup.'}</p><div class="acts" style="justify-content:flex-start"><button class="b pri" onclick="backup()">Buat backup</button></div></div>`;

      if (pend) {
        html += `<div class="card"><h2>Pulihkan dari backup?</h2><p>File berisi ${pend.items.length} barang, ${pend.masuk.length} barang masuk, ${pend.keluar.length} barang keluar. Data di perangkat ini akan diganti.</p><div class="acts" style="justify-content:flex-start"><button class="b pri" onclick="restorePending()">Pulihkan</button><button class="b" onclick="pend=null;render()">Batal</button></div></div>`;
      }

      html += `<div class="card"><h2>Backup & impor</h2><p>Impor file hasil backup untuk memulihkan data lama.</p><label style="margin-top:0">File backup<input type="file" accept="application/json" onchange="pick(event)"></label></div>`;

      html += `<div class="card"><h2>Laporan PDF</h2><p>Laporan memakai KOP CV. Satu Atap Karya. Di HP akan muncul menu bagikan (WhatsApp dan lainnya). Di komputer file langsung diunduh.</p><label>Jenis laporan<select onchange="rep.t=this.value"><option value="stok"${rep.t === 'stok' ? ' selected' : ''}>Stok barang</option><option value="masuk"${rep.t === 'masuk' ? ' selected' : ''}>Barang masuk</option><option value="keluar"${rep.t === 'keluar' ? ' selected' : ''}>Barang keluar</option></select></label><label>Kategori<select onchange="rep.c=+this.value">${SH.map((label, index) => `<option value="${index}"${rep.c === index ? ' selected' : ''}>${label}</option>`).join('')}</select></label><div class="two"><label>Dari tanggal<input type="date" value="${rep.f}" onchange="rep.f=this.value"></label><label>Sampai tanggal<input type="date" value="${rep.to}" onchange="rep.to=this.value"></label></div><p style="margin-top:8px">Tanggal berlaku untuk laporan masuk dan keluar. Kosongkan untuk semua tanggal.</p><div class="acts" style="justify-content:flex-start"><button class="b pri" onclick="pdf()">Buat PDF</button></div></div>`;
      return html;
    }

    function closeM() {
      const m = $('#m');
      if (m) m.innerHTML = '';
    }

    function openForm(title, fields, values, save, del) {
      let force = false;
      let arm = false;
      const formHtml = `
        <div class="ov" onclick="closeM()">
          <div class="sheet" onclick="event.stopPropagation()">
            <h2>${title}</h2>
            ${fields.map((field) => `
              <label>${field.l}${field.t === 'select' ? `<select id="f_${field.k}">${field.o.map(([value, text]) => `<option value="${value}">${text}</option>`).join('')}</select>` : `<input id="f_${field.k}" type="${field.t || 'text'}">`}
            </label>
            `).join('')}
            <div id="fe" class="err"></div>
            <div class="acts">
              <button class="b" id="fd" type="button" style="display:${del ? 'inline-flex' : 'none'}">Hapus</button>
              <button class="b pri" id="fs" type="button">Simpan</button>
            </div>
          </div>
        </div>
      `;

      const m = $('#m');
      if (!m) return;
      m.innerHTML = formHtml;

      fields.forEach((field) => {
        const input = document.getElementById(`f_${field.k}`);
        if (!input) return;
        const value = values && values[field.k] == null ? '' : values[field.k];
        input.value = value ?? '';
      });

      const done = () => {
        persist();
        closeM();
        render();
      };

      const saveButton = $('#fs');
      const errorBox = $('#fe');
      const deleteButton = $('#fd');

      if (saveButton) {
        saveButton.onclick = () => {
          const payload = {};
          fields.forEach((field) => {
            const input = document.getElementById(`f_${field.k}`);
            payload[field.k] = input ? (input.value ?? '').trim() : '';
          });

          const result = save(payload, force);
          if (result && result.err) {
            if (errorBox) errorBox.textContent = result.err;
            return;
          }
          if (result && result.warn && !force) {
            force = true;
            if (errorBox) errorBox.textContent = result.warn;
            if (saveButton) saveButton.textContent = 'Tetap simpan';
            return;
          }
          done();
        };
      }

      if (deleteButton && del) {
        deleteButton.onclick = () => {
          if (!arm) {
            arm = true;
            deleteButton.textContent = 'Yakin hapus?';
            return;
          }
          const result = del();
          if (result) {
            if (errorBox) errorBox.textContent = result;
            return;
          }
          done();
        };
      }
    }

    function itemForm(id) {
      const it = S.items.find((item) => item.id === id) || { kat: KATS[Math.max(cat - 1, 0)] || KATS[0], awal: 0, min: 0 };
      openForm(id ? 'Ubah barang' : 'Barang baru', [
        { k: 'kode', l: 'Kode barang', t: 'text' },
        { k: 'nama', l: 'Nama barang', t: 'text' },
        { k: 'kat', l: 'Kategori', t: 'select', o: KATS.map((category) => [category, category]) },
        { k: 'satuan', l: 'Satuan (sak, pcs, box, dll)', t: 'text' },
        { k: 'awal', l: 'Stok awal', t: 'number' },
        { k: 'min', l: 'Minimum stok', t: 'number' }
      ], it, (v) => {
        if (!v.kode || !v.nama || !v.satuan) return { err: 'Kode, nama, dan satuan wajib diisi.' };
        if (S.items.some((item) => item.kode === v.kode && item.id !== id)) return { err: 'Kode sudah dipakai barang lain.' };
        v.awal = Number(v.awal) || 0;
        v.min = Number(v.min) || 0;
        if (id) Object.assign(it, v); else S.items.push({ id: uid(), ...v });
      }, id ? () => {
        if (S.masuk.concat(S.keluar).some((entry) => entry.bid === id)) {
          return 'Barang ini punya riwayat masuk/keluar. Hapus riwayatnya dulu.';
        }
        S.items = S.items.filter((item) => item.id !== id);
      } : null);
    }

    function txForm(type, id) {
      if (!S.items.length) {
        toast('Tambahkan barang dulu di tab Barang');
        return;
      }

      const tx = S[type].find((entry) => entry.id === id) || { tgl: today(), bid: S.items[0].id };
      const isIn = type === 'masuk';
      const fields = [
        { k: 'tgl', l: 'Tanggal', t: 'date' },
        { k: 'no', l: isIn ? 'No. nota' : 'No. bukti / surat jalan', t: 'text' },
        { k: 'bid', l: 'Barang', t: 'select', o: S.items.map((item) => [item.id, `${item.kode} - ${item.nama} (${item.satuan})`]) },
        { k: 'qty', l: 'Jumlah', t: 'number' },
        ...(isIn ? [{ k: 'harga', l: 'Harga satuan (Rp)', t: 'number' }, { k: 'sup', l: 'Supplier', t: 'text' }] : [{ k: 'tujuan', l: 'Penerima / proyek', t: 'text' }]),
        { k: 'ket', l: 'Keterangan', t: 'text' }
      ];

      openForm((id ? 'Ubah ' : 'Catat ') + (isIn ? 'barang masuk' : 'barang keluar'), fields, tx, (v, forceFlag) => {
        v.qty = Number(v.qty) || 0;
        if (!v.tgl || !(v.qty > 0)) return { err: 'Tanggal dan jumlah (lebih dari 0) wajib diisi.' };

        if (isIn) {
          v.harga = Number(v.harga) || 0;
        } else {
          const current = calc()[v.bid] || { i: { nama: '', satuan: '' }, s: 0 };
          const prev = id && tx.bid === v.bid ? Number(tx.qty) || 0 : 0;
          if (current.s + prev - v.qty < 0) {
            return {
              warn: `Stok ${current.i.nama} hanya ${num(current.s + prev)} ${current.i.satuan}. Pengeluaran ini membuat stok minus.`
            };
          }
        }

        if (id) Object.assign(tx, v); else S[type].push({ id: uid(), ...v });
      }, id ? () => {
        S[type] = S[type].filter((entry) => entry.id !== id);
      } : null);
    }

    async function saveFile(name, data, type) {
      const blob = new Blob([data], { type });
      const file = new File([blob], name, { type });

      if (navigator.canShare && matchMedia('(pointer:coarse)').matches && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: name });
          return 'ok';
        } catch (error) {
          if (error && error.name === 'AbortError') return 'cancel';
        }
      }

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return 'ok';
    }

    async function backup() {
      try {
        const payload = JSON.stringify({ app: 'sab', versi: 1, waktu: new Date().toISOString(), items: S.items, masuk: S.masuk, keluar: S.keluar });
        const result = await saveFile('backup-stok-satu-atap-' + today() + '.json', payload, 'application/json');
        if (result === 'ok') {
          try { localStorage.setItem('sab_last', today()); } catch (error) {}
          toast('Backup dibuat. Simpan file di tempat aman.');
          render();
        }
      } catch (error) {
        toast('Backup gagal dibuat');
      }
    }

    function pick(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || 'null'));
          if (!parsed || !Array.isArray(parsed.items) || !Array.isArray(parsed.masuk) || !Array.isArray(parsed.keluar)) {
            throw new Error('invalid');
          }
          pend = { items: parsed.items, masuk: parsed.masuk, keluar: parsed.keluar };
          render();
        } catch (error) {
          pend = null;
          toast('File backup tidak valid.');
        }
      };
      reader.onerror = () => toast('Gagal membaca file backup.');
      reader.readAsText(file);
      event.target.value = '';
    }

    function restorePending() {
      if (!pend) return;
      S = {
        items: Array.isArray(pend.items) ? pend.items : [],
        masuk: Array.isArray(pend.masuk) ? pend.masuk : [],
        keluar: Array.isArray(pend.keluar) ? pend.keluar : []
      };
      pend = null;
      persist();
      render();
      toast('Backup berhasil dipulihkan.');
    }

    async function pdf() {
      if (!window.jspdf) {
        toast('PDF belum siap. Periksa koneksi internet lalu coba lagi.');
        return;
      }

      const C = calc();
      const t = rep.t;
      const k = rep.c;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();
      const H = doc.internal.pageSize.getHeight();
      let head = [];
      let body = [];
      const cs = {};

      if (t === 'stok') {
        head = [['No', 'Kode', 'Nama barang', 'Satuan', 'Awal', 'Masuk', 'Keluar', 'Sisa', 'Status']];
        cs[4] = { halign: 'right' };
        cs[5] = { halign: 'right' };
        cs[6] = { halign: 'right' };
        cs[7] = { halign: 'right', fontStyle: 'bold' };

        (k ? [KATS[k - 1]] : KATS).forEach((category) => {
          const rows = S.items.filter((item) => item.kat === category).map((item) => C[item.id]);
          if (!rows.length) return;
          body.push([{ content: category, colSpan: 9, styles: { fillColor: [217, 226, 243], fontStyle: 'bold', textColor: [11, 31, 63] } }]);
          rows.forEach((row, index) => body.push([
            index + 1,
            row.i.kode,
            row.i.nama,
            row.i.satuan,
            num(row.i.awal),
            num(row.in),
            num(row.out),
            num(row.s),
            row.st
          ]));
        });
      } else {
        const list = S[t].filter((entry) => C[entry.bid] && (!k || C[entry.bid].i.kat === KATS[k - 1]) && (!rep.f || entry.tgl >= rep.f) && (!rep.to || entry.tgl <= rep.to)).sort((a, b) => a.tgl.localeCompare(b.tgl));

        if (t === 'masuk') {
          head = [['No', 'Tanggal', 'No. nota', 'Barang', 'Jumlah', 'Satuan', 'Harga satuan', 'Total']];
          cs[4] = { halign: 'right' };
          cs[6] = { halign: 'right' };
          cs[7] = { halign: 'right' };
          let total = 0;
          list.forEach((entry, index) => {
            const row = C[entry.bid];
            const price = Number(entry.harga) || 0;
            const subtotal = Number(entry.qty) * price;
            total += subtotal;
            body.push([
              index + 1,
              dm(entry.tgl),
              entry.no || '',
              `${row.i.kode} ${row.i.nama}`,
              num(entry.qty),
              row.i.satuan,
              rp(price),
              rp(subtotal)
            ]);
          });
          if (list.length) {
            body.push([{ content: 'Total pembelian', colSpan: 7, styles: { halign: 'right', fontStyle: 'bold' } }, { content: rp(total), styles: { halign: 'right', fontStyle: 'bold' } }]);
          }
        } else {
          head = [['No', 'Tanggal', 'No. bukti', 'Barang', 'Jumlah', 'Satuan', 'Penerima / proyek']];
          cs[4] = { halign: 'right' };
          list.forEach((entry, index) => {
            const row = C[entry.bid];
            body.push([
              index + 1,
              dm(entry.tgl),
              entry.no || '',
              `${row.i.kode} ${row.i.nama}`,
              num(entry.qty),
              row.i.satuan,
              entry.tujuan || ''
            ]);
          });
        }
      }

      if (!body.length) {
        toast('Tidak ada data untuk laporan ini');
        return;
      }

      doc.addImage(LOGO, 'PNG', 14, 9, 24, 15.4);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.setTextColor(11, 31, 63);
      doc.text('CV. Satu Atap Karya', 44, 19.5);
      doc.setDrawColor(31, 78, 156);
      doc.setLineWidth(.8);
      doc.line(14, 28, W - 14, 28);
      doc.setLineWidth(.2);
      doc.line(14, 29.3, W - 14, 29.3);
      doc.setFontSize(13);
      doc.text({ stok: 'LAPORAN STOK BARANG', masuk: 'LAPORAN BARANG MASUK', keluar: 'LAPORAN BARANG KELUAR' }[t], W / 2, 38, { align: 'center' });
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(70, 80, 100);
      const periodText = t === 'stok' ? 'Per tanggal ' + dm(today()) : 'Periode: ' + (rep.f || rep.to ? dm(rep.f || '') + ' s/d ' + dm(rep.to || today()) : 'Semua tanggal');
      doc.text('Kategori: ' + SH[k] + '   |   ' + periodText, W / 2, 44, { align: 'center' });

      doc.autoTable({
        startY: 49,
        head,
        body,
        theme: 'grid',
        margin: { left: 14, right: 14, bottom: 16 },
        columnStyles: cs,
        styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 1.8, lineColor: [200, 208, 222], textColor: [20, 30, 50] },
        didDrawPage: () => {
          doc.setFontSize(8);
          doc.setTextColor(110);
          doc.text('Dicetak ' + dm(today()), 14, H - 8);
          doc.text('Hal. ' + doc.internal.getNumberOfPages(), W - 14, H - 8, { align: 'right' });
        }
      });

      try {
        const result = await saveFile('laporan-' + t + '-' + today() + '.pdf', doc.output('arraybuffer'), 'application/pdf');
        if (result === 'ok') toast('PDF siap');
      } catch (error) {
        toast('PDF gagal dibuat');
      }
    }

    render();
  </script>
</body>
</html>
