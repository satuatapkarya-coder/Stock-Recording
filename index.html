<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stok Barang | CV. Satu Atap Karya</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F5F9;--sf:#fff;--ink:#0B1F3F;--mu:#5B6B85;--ln:#D8DFEA;--ac:#1F4E9C;--acs:#E4ECF8;--ok:#1E7B4B;--wa:#9A6700;--bd:#C0392B;--hd:#0B1F3F;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08142B;--sf:#0F2142;--ink:#E8EEF8;--mu:#9AA9C4;--ln:#1E345E;--ac:#6B9AE8;--acs:#16305C;--ok:#5FC48D;--wa:#E8B550;--bd:#F07A6B;--hd:#0F2142;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08142B;--sf:#0F2142;--ink:#E8EEF8;--mu:#9AA9C4;--ln:#1E345E;--ac:#6B9AE8;--acs:#16305C;--ok:#5FC48D;--wa:#E8B550;--bd:#F07A6B;--hd:#0F2142;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header .lg{background:#fff;border-radius:10px;padding:5px 7px;display:flex}
header img{height:34px;display:block}
header b{font-size:19px;font-weight:700;letter-spacing:.2px;display:block;line-height:1.1}
header small{opacity:.75;font-size:13px}
main{max-width:640px;margin:0 auto;padding:14px 14px 0}
h3{font-size:15px;margin:18px 2px 8px;color:var(--mu);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:11px 13px;margin-bottom:7px}
.row .n{font-weight:600}.row .s{font-size:13px;color:var(--mu)}
.row .r{text-align:right;white-space:nowrap}.row .q{font-size:20px;font-weight:700}
.bg{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;display:inline-block}
.Aman{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.Menipis{color:var(--wa);background:color-mix(in srgb,var(--wa) 16%,transparent)}
.Habis,.Minus{color:var(--bd);background:color-mix(in srgb,var(--bd) 14%,transparent)}
.in{color:var(--ok)}.out{color:var(--bd)}
.alert{background:color-mix(in srgb,var(--wa) 14%,transparent);border-radius:10px;padding:10px 13px;margin:10px 0 4px;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 6px}.card p{margin:0 0 10px;color:var(--mu);font-size:14px}
.b{font:inherit;font-weight:600;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer}
.b.pri{background:var(--ac);border-color:var(--ac);color:#fff}.b.dang{color:var(--bd);border-color:var(--bd)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:14px;font-weight:500;color:var(--mu);margin-top:10px}
input,select{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:10px 11px}
input:focus-visible,select:focus-visible,.b:focus-visible,.chip:focus-visible,nav button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:8;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:14px 2px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sf);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 2px;font-size:19px}
.err{color:var(--bd);font-size:14px;margin:8px 0 0;min-height:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style></head><body>

const TABS=[['stok','Stok'],['masuk','Masuk'],['keluar','Keluar'],['barang','Barang'],['lain','Lainnya']];
const FAB={stok:'+ Barang',masuk:'+ Barang masuk',keluar:'+ Barang keluar',barang:'+ Barang'};
let S=load(),tab='stok',cat=0,DL=null,pend=null,rep={t:'stok',c:0,f:'',to:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>(+n||0).toLocaleString('id-ID',{maximumFractionDigits:2});
const rp=n=>'Rp '+num(n);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dm=s=>s?s.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(){try{const r=localStorage.getItem(K);if(r){const d=JSON.parse(r);if(d&&d.items)return d}}catch(e){}return{items:[],masuk:[],keluar:[]}}
function persist(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Data tidak bisa disimpan di perangkat. Segera buat backup.')}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function toast(t){const e=$('#t');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3200)}
function calc(){const m={};S.items.forEach(i=>m[i.id]={i,in:0,out:0});
 S.masuk.forEach(x=>m[x.bid]&&(m[x.bid].in+=+x.qty));S.keluar.forEach(x=>m[x.bid]&&(m[x.bid].out+=+x.qty));
 Object.values(m).forEach(r=>{r.s=(+r.i.awal||0)+r.in-r.out;r.st=r.s<0?'Minus':r.s===0?'Habis':r.s<=(+r.i.min||0)?'Menipis':'Aman'});return m}
const inCat=i=>!cat||(i&&i.kat===KATS[cat-1]);
function chips(){return`<div class="chips">${SH.map((s,n)=>`<button class="chip${n===cat?' on':''}" onclick="cat=${n};render()">${s}</button>`).join('')}</div>`}
function empty(a,b){return`<div class="empty"><b>${a}</b>${b}</div>`}
function groups(rows,fn){let h='';KATS.forEach((k,n)=>{if(cat&&cat!==n+1)return;const r=rows.filter(x=>x.i.kat===k);if(r.length)h+=`<h3>${k}</h3>`+r.map(fn).join('')});return h}
function render(){
 const C=calc();let h='';
 if(tab==='stok'||tab==='barang'){
  const rows=S.items.map(i=>C[i.id]),low=rows.filter(r=>inCat(r.i)&&r.st!=='Aman').length;
  h=chips()+(tab==='stok'&&low?`<p class="alert">${low} barang perlu dicek: stok menipis, habis, atau minus.</p>`:'')+
  (S.items.length?groups(rows,r=>tab==='stok'?
   `<div class="row" onclick="itemForm('${r.i.id}')"><div><div class="n">${esc(r.i.nama)}</div><div class="s">${esc(r.i.kode)} | masuk ${num(r.in)} | keluar ${num(r.out)}</div></div><div class="r"><div class="q">${num(r.s)} <small>${esc(r.i.satuan)}</small></div><span class="bg ${r.st}">${r.st}</span></div></div>`:
   `<div class="row" onclick="itemForm('${r.i.id}')"><div><div class="n">${esc(r.i.nama)}</div><div class="s">${esc(r.i.kode)} | ${esc(r.i.satuan)} | stok awal ${num(r.i.awal)} | minimum ${num(r.i.min)}</div></div></div>`)
   ||empty('Tidak ada barang di kategori ini','Pilih kategori lain atau tambah barang.'):empty('Belum ada barang','Mulai dengan tombol “+ Barang”, lalu catat barang masuk dan keluar.'));
 }else if(tab==='masuk'||tab==='keluar'){
  const L=S[tab].filter(x=>C[x.bid]&&inCat(C[x.bid].i)).sort((a,b)=>(b.tgl+b.id).localeCompare(a.tgl+a.id));
  h=chips()+(L.length?L.map(x=>{const r=C[x.bid];return`<div class="row" onclick="txForm('${tab}','${x.id}')"><div><div class="n">${esc(r.i.nama)}</div><div class="s">${dm(x.tgl)}${x.no?' | '+esc(x.no):''}${x.sup||x.tujuan?' | '+esc(x.sup||x.tujuan):''}</div></div><div class="r"><div class="q ${tab==='masuk'?'in':'out'}">${tab==='masuk'?'+':'-'}${num(x.qty)} <small>${esc(r.i.satuan)}</small></div>${tab==='masuk'&&x.harga?`<div class="s">${rp(x.qty*x.harga)}</div>`:''}</div></div>`}).join(''):empty('Belum ada catatan','Tekan tombol di kanan bawah untuk mencatat.'));
 }else h=lain();
 $('#v').innerHTML=h;
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)">${t[1]}</button>`).join('');
 const f=$('#fab');f.style.display=FAB[tab]?'block':'none';f.textContent=FAB[tab]||'';
 f.onclick=()=>tab==='masuk'||tab==='keluar'?txForm(tab):itemForm();
}
function lain(){
 const last=lsGet('sab_last'),dl=DL?'':' disabled';
 let h=`<div class="card"><h2>Data & backup</h2><p>Data tersimpan di perangkat ini (${S.items.length} barang, ${S.masuk.length} masuk, ${S.keluar.length} keluar). ${last?'Backup terakhir: '+dm(last)+'.':'Belum pernah di-backup.'} Simpan file backup ke tempat aman, misalnya kirim ke WhatsApp atau Google Drive, agar data tidak hilang jika browser dibersihkan atau HP diganti.</p><div class="acts" style="justify-content:flex-start"><button class="b pri"${dl} onclick="backup()">Backup data</button><label class="b" style="margin:0">Pulihkan data<input type="file" accept=".json,application/json" hidden onchange="pick(event)"></label></div></div>`;
 if(pend)h+=`<div class="card"><h2>Pulihkan dari backup?</h2><p>File berisi ${pend.items.length} barang, ${pend.masuk.length} barang masuk, ${pend.keluar.length} barang keluar. Data di perangkat ini akan diganti.</p><div class="acts" style="justify-content:flex-start"><button class="b dang" onclick="S=pend;pend=null;persist();toast('Data dipulihkan');render()">Ganti dengan backup</button><button class="b" onclick="pend=null;render()">Batal</button></div></div>`;
 h+=`<div class="card"><h2>Laporan PDF</h2><p>Laporan memakai KOP CV. Satu Atap Karya. Setelah dibuat, pilih tempat menyimpan atau kirim lewat menu bagikan.</p>
 <label>Jenis laporan<select onchange="rep.t=this.value"><option value="stok"${rep.t==='stok'?' selected':''}>Stok barang</option><option value="masuk"${rep.t==='masuk'?' selected':''}>Barang masuk</option><option value="keluar"${rep.t==='keluar'?' selected':''}>Barang keluar</option></select></label>
 <label>Kategori<select onchange="rep.c=+this.value">${SH.map((s,n)=>`<option value="${n}"${rep.c===n?' selected':''}>${s}</option>`).join('')}</select></label>
 <div class="two"><label>Dari tanggal<input type="date" value="${rep.f}" onchange="rep.f=this.value"></label><label>Sampai tanggal<input type="date" value="${rep.to}" onchange="rep.to=this.value"></label></div>
 <p style="margin-top:8px">Tanggal berlaku untuk laporan masuk dan keluar. Kosongkan untuk semua tanggal.</p><div class="acts" style="justify-content:flex-start"><button class="b pri"${dl} onclick="pdf()">Buat PDF</button></div></div>`;
 return h+(DL?'':'<p class="alert">Fitur simpan file (backup dan PDF) hanya aktif saat halaman dibuka lewat claude.ai.</p>');
}
function closeM(){$('#m').innerHTML=''}
function openForm(title,fs,v,save,del){
 let force=false,arm=false;
 $('#m').innerHTML=`<div class="ov" onclick="closeM()"><div class="sheet" onclick="event.stopPropagation()"><h2>${title}</h2>${fs.map(f=>`<label>${f.l}${f.t==='select'?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t}"${f.t==='number'?' inputmode="decimal" step="any" min="0"':''}>`}</label>`).join('')}<p id="fe" class="err"></p><div class="acts">${del?'<button class="b dang" id="fd">Hapus</button>':''}<button class="b" onclick="closeM()">Batal</button><button class="b pri" id="fs">Simpan</button></div></div></div>`;
 fs.forEach(f=>{$('#f_'+f.k).value=v[f.k]==null?'':v[f.k]});
 const done=()=>{persist();closeM();render()};
 $('#fs').onclick=()=>{const o={};fs.forEach(f=>o[f.k]=$('#f_'+f.k).value.trim());const r=save(o,force);
  if(r&&r.err){$('#fe').textContent=r.err;return}
  if(r&&r.warn&&!force){force=true;$('#fe').textContent=r.warn;$('#fs').textContent='Tetap simpan';return}
  done()};
 if(del)$('#fd').onclick=()=>{if(!arm){arm=true;$('#fd').textContent='Yakin hapus?';return}const e=del();if(e){$('#fe').textContent=e;return}done()};
}
function itemForm(id){
 const it=S.items.find(x=>x.id===id)||{kat:KATS[Math.max(cat-1,0)],awal:0,min:0};
 openForm(id?'Ubah barang':'Barang baru',[{k:'kode',l:'Kode barang',t:'text'},{k:'nama',l:'Nama barang',t:'text'},{k:'kat',l:'Kategori',t:'select',o:KATS.map(k=>[k,k])},{k:'satuan',l:'Satuan (sak, unit, rim, m3)',t:'text'},{k:'awal',l:'Stok awal',t:'number'},{k:'min',l:'Stok minimum (batas menipis)',t:'number'}],it,v=>{
  if(!v.kode||!v.nama||!v.satuan)return{err:'Kode, nama, dan satuan wajib diisi.'};
  if(S.items.some(x=>x.kode===v.kode&&x.id!==id))return{err:'Kode sudah dipakai barang lain.'};
  v.awal=+v.awal||0;v.min=+v.min||0;
  if(id)Object.assign(it,v);else S.items.push(Object.assign({id:uid()},v))
 },id?()=>{if(S.masuk.concat(S.keluar).some(x=>x.bid===id))return'Barang ini punya riwayat masuk/keluar. Hapus riwayatnya dulu.';S.items=S.items.filter(x=>x.id!==id)}:null);
}
function txForm(type,id){
 if(!S.items.length){toast('Tambahkan barang dulu di tab Barang');return}
 const tx=S[type].find(x=>x.id===id)||{tgl:today(),bid:S.items[0].id},isIn=type==='masuk';
 const fs=[{k:'tgl',l:'Tanggal',t:'date'},{k:'no',l:isIn?'No. nota':'No. bukti / surat jalan',t:'text'},{k:'bid',l:'Barang',t:'select',o:S.items.map(i=>[i.id,i.kode+' - '+i.nama+' ('+i.satuan+')'])},{k:'qty',l:'Jumlah',t:'number'}]
  .concat(isIn?[{k:'harga',l:'Harga satuan (Rp)',t:'number'},{k:'sup',l:'Supplier',t:'text'}]:[{k:'tujuan',l:'Penerima / proyek',t:'text'}],[{k:'ket',l:'Keterangan',t:'text'}]);
 openForm((id?'Ubah ':'Catat ')+(isIn?'barang masuk':'barang keluar'),fs,tx,v=>{
  v.qty=+v.qty;if(!v.tgl||!(v.qty>0))return{err:'Tanggal dan jumlah (lebih dari 0) wajib diisi.'};
  if(isIn)v.harga=+v.harga||0;
  else{const r=calc()[v.bid],prev=id&&tx.bid===v.bid?+tx.qty:0;if(r.s+prev-v.qty<0)return{warn:`Stok ${r.i.nama} hanya ${num(r.s+prev)} ${r.i.satuan}. Pengeluaran ini membuat stok minus.`}}
  if(id)Object.assign(tx,v);else S[type].push(Object.assign({id:uid()},v))
 },id?()=>{S[type]=S[type].filter(x=>x.id!==id)}:null);
}
async function backup(){
 if(!DL)return;
 try{await DL.save({filename:'backup-stok-satu-atap-'+today()+'.json',data:JSON.stringify({app:'sab',versi:1,waktu:new Date().toISOString(),items:S.items,masuk:S.masuk,keluar:S.keluar})});
  try{localStorage.setItem('sab_last',today())}catch(e){}toast('Backup disimpan');render()}
 catch(e){if(e&&e.code!=='declined')toast('Backup gagal: '+(e.message||e.code))}
}
function pick(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items)||!Array.isArray(d.masuk)||!Array.isArray(d.keluar))throw 0;pend={items:d.items,masuk:d.masuk,keluar:d.keluar}}catch(x){pend=null;toast('File itu bukan backup yang valid')}render()};
 r.readAsText(f);e.target.value=''}
async function pdf(){
 if(!DL||!window.jspdf){toast('PDF belum siap. Coba lagi sebentar lagi.');return}
 const C=calc(),t=rep.t,k=rep.c,{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight();
 let head,body=[],cs={},extra=[];
 if(t==='stok'){
  head=[['No','Kode','Nama barang','Satuan','Awal','Masuk','Keluar','Sisa','Status']];cs={4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right',fontStyle:'bold'}};
  (k?[KATS[k-1]]:KATS).forEach(kt=>{const rs=S.items.filter(i=>i.kat===kt).map(i=>C[i.id]);if(!rs.length)return;
   body.push([{content:kt,colSpan:9,styles:{fillColor:[217,226,243],fontStyle:'bold',textColor:[11,31,63]}}]);
   rs.forEach((r,n)=>body.push([n+1,r.i.kode,r.i.nama,r.i.satuan,num(r.i.awal),num(r.in),num(r.out),num(r.s),r.st]))});
 }else{
  const L=S[t].filter(x=>C[x.bid]&&(!k||C[x.bid].i.kat===KATS[k-1])&&(!rep.f||x.tgl>=rep.f)&&(!rep.to||x.tgl<=rep.to)).sort((a,b)=>a.tgl.localeCompare(b.tgl));
  if(t==='masuk'){head=[['No','Tanggal','No. nota','Barang','Jumlah','Satuan','Harga satuan','Total']];cs={4:{halign:'right'},6:{halign:'right'},7:{halign:'right'}};
   let tot=0;L.forEach((x,n)=>{const r=C[x.bid],s=x.qty*(x.harga||0);tot+=s;body.push([n+1,dm(x.tgl),x.no||'',r.i.kode+' '+r.i.nama,num(x.qty),r.i.satuan,rp(x.harga),rp(s)])});
   if(L.length)body.push([{content:'Total pembelian',colSpan:7,styles:{halign:'right',fontStyle:'bold'}},{content:rp(tot),styles:{halign:'right',fontStyle:'bold'}}]);
  }else{head=[['No','Tanggal','No. bukti','Barang','Jumlah','Satuan','Penerima / proyek']];cs={4:{halign:'right'}};
   L.forEach((x,n)=>{const r=C[x.bid];body.push([n+1,dm(x.tgl),x.no||'',r.i.kode+' '+r.i.nama,num(x.qty),r.i.satuan,x.tujuan||''])})}
 }
 if(!body.length){toast('Tidak ada data untuk laporan ini');return}
 d.addImage(LOGO,'PNG',14,9,24,15.4);
 d.setFont('helvetica','bold');d.setFontSize(18);d.setTextColor(11,31,63);d.text('CV. Satu Atap Karya',44,19.5);
 d.setDrawColor(31,78,156);d.setLineWidth(.8);d.line(14,28,W-14,28);d.setLineWidth(.2);d.line(14,29.3,W-14,29.3);
 d.setFontSize(13);d.text({stok:'LAPORAN STOK BARANG',masuk:'LAPORAN BARANG MASUK',keluar:'LAPORAN BARANG KELUAR'}[t],W/2,38,{align:'center'});
 d.setFont('helvetica','normal');d.setFontSize(9.5);d.setTextColor(70,80,100);
 const per=t==='stok'?'Per tanggal '+dm(today()):'Periode: '+(rep.f||rep.to?dm(rep.f||'')+' s/d '+dm(rep.to||today()):'Semua tanggal');
 d.text('Kategori: '+SH[k]+'   |   '+per,W/2,44,{align:'center'});
 d.autoTable({startY:49,head,body,theme:'grid',margin:{left:14,right:14,bottom:16},columnStyles:cs,styles:{font:'helvetica',fontSize:8.5,cellPadding:1.8,lineColor:[200,208,222],textColor:[20,30,50]},headStyles:{fillColor:[11,31,63],textColor:255,halign:'center'},
  didDrawPage:()=>{d.setFontSize(8);d.setTextColor(110);d.text('Dicetak '+dm(today()),14,H-8);d.text('Hal. '+d.internal.getNumberOfPages(),W-14,H-8,{align:'right'})}});
 try{await DL.save({filename:'laporan-'+t+'-'+today()+'.pdf',data:d.output('arraybuffer')});toast('PDF disimpan')}
 catch(e){if(e&&e.code!=='declined')toast('PDF gagal: '+(e.message||e.code))}
}
render();
(async()=>{try{DL=await claude.use('downloads')}catch(e){}if(tab==='lain')render()})();
</script></body></html>
